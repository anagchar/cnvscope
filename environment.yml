# cnvscope in its own conda environment:
#
#   conda env create -f environment.yml
#   conda activate cnvscope
#   cnvscope --mode dna --tool chisel --input chisel_out/ --outdir results/
#
# The last pip step installs cnvscope from this folder and builds its web interface (Node.js).
name: cnvscope
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.10
  - anndata >=0.10
  - h5py >=3.8
  - numpy >=1.24
  - pandas >=2.0
  - scipy >=1.10
  - fastapi >=0.110
  - uvicorn >=0.27
  - click >=8.1
  - hatchling
  - nodejs >=20
  - pip
  # reading ASCAT.sc result objects (.rds / .Rda) goes through R
  - r-base >=4.2
  - r-data.table
  - r-jsonlite
  - pip:
      - -e .
