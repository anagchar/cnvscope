[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cnvscope"
version = "0.1.0.dev0"
description = "Interactive viewer for single-cell copy-number calls from scDNA, scRNA and scATAC tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "anndata>=0.10",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "click>=8.1",
  "h5py>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.urls]
Homepage = "https://anagchar.github.io/cnvscope"
Source = "https://github.com/anagchar/cnvscope"

[project.scripts]
cnvscope = "cnvscope.cli:main"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cnvscope"]
artifacts = ["src/cnvscope/static/**", "src/cnvscope/R/*.R"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
