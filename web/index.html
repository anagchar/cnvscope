<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cnvscope</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      try {
        // light by default; dark only when chosen (the choice is remembered)
        const t = localStorage.getItem("cnvscope-theme") === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch { /* storage blocked */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
